<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control de Flota y Mantenciones</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            padding: 24px;
            border: 1px solid #334155;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #38bdf8;
            text-align: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }

        .field-group {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            flex: 1;
            margin-bottom: 16px;
        }

        label {
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #94a3b8;
            font-weight: 600;
        }

        input[type="number"], input[type="text"] {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f8fafc;
            padding: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus, input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .alert-status {
            padding: 14px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background-color: #0f172a;
            color: #94a3b8;
            border: 1px solid #334155;
            margin-top: 10px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Control de Mantención de Vehículo</h2>

        <!-- MÓDULO DE CONTROL DE KILOMETRAJE Y MANTENCIÓN -->
        <div class="field-group">
            <div class="field">
                <label for="km_actual">Kilometraje Actual:</label>
                <input type="number" id="km_actual" placeholder="Ej: 45900" oninput="calcularMantencion()">
            </div>
            <div class="field">
                <label for="km_mantencion">Km Última Mantención / Límite:</label>
                <input type="number" id="km_mantencion" placeholder="Ej: 45000" oninput="calcularMantencion()">
            </div>
        </div>

        <div class="field">
            <label for="horometro_actual">Horómetro Actual (Horas Motor):</label>
            <input type="number" id="horometro_actual" placeholder="Ej: 1250 hrs">
        </div>

        <!-- Caja de estado de Alerta -->
        <div id="status-mantencion" class="alert-status">
            Ingrese kilometraje actual y límite de mantención.
        </div>

        <button type="button" class="btn-submit" onclick="guardarRegistro()">Guardar Registro</button>
    </div>

    <script>
        /**
         * Evalúa el kilometraje actual versus el límite fijado de mantención
         * Alertas:
         * - ROJA: Kilometraje actual > Kilometraje límite (Vencida/Se pasó)
         * - AMARILLA: Faltan 1000 km o menos para el límite (Próxima)
         * - VERDE: Faltan más de 1000 km para el límite (Al día)
         */
        function calcularMantencion() {
            const actualVal = document.getElementById('km_actual').value;
            const limiteVal = document.getElementById('km_mantencion').value;
            const box = document.getElementById('status-mantencion');

            if (!box) return;

            const actual = parseInt(actualVal, 10);
            const limite = parseInt(limiteVal, 10);

            // Validación de campos vacíos o no numéricos
            if (isNaN(actual) || isNaN(limite) || actualVal.trim() === '' || limiteVal.trim() === '') {
                box.style.background = "#0f172a";
                box.style.color = "#94a3b8";
                box.style.border = "1px solid #334155";
                box.innerText = "Ingrese kilometraje actual y límite de mantención.";
                return;
            }

            // Cálculo: Límite menos Kilometraje Actual
            const restantes = limite - actual;

            if (restantes < 0) {
                // 🚨 ALERTA ROJA: MANTENCIÓN VENCIDA (Se pasó del kilometraje límite)
                const exceso = Math.abs(restantes);
                box.style.background = "#dc262620";
                box.style.color = "#f87171";
                box.style.border = "1px solid #dc2626";
                box.innerText = `¡ALERTA CRÍTICA! Mantención Vencida. Excedido en ${exceso} km.`;
            } else if (restantes <= 1000) {
                // ⚠️ ADVERTENCIA AMARILLA: FALTAN 1000 KM O MENOS
                box.style.background = "#eab30820";
                box.style.color = "#facc15";
                box.style.border = "1px solid #eab308";
                box.innerText = `¡ADVERTENCIA! Mantención Próxima. Faltan ${restantes} km para la mantención.`;
            } else {
                // ✅ ESTADO VERDE: AL DÍA (Faltan más de 1000 km)
                box.style.background = "#16a34a20";
                box.style.color = "#4ade80";
                box.style.border = "1px solid #16a34a";
                box.innerText = `Mantención al día. Faltan ${restantes} km para la próxima mantención.`;
            }
        }

        function guardarRegistro() {
            const actual = document.getElementById('km_actual').value;
            const limite = document.getElementById('km_mantencion').value;
            if (!actual || !limite) {
                alert("Por favor, complete los datos antes de guardar.");
                return;
            }
            alert("Registro guardado exitosamente.");
        }

        // Ejecutar evaluación inicial al cargar el documento
        document.addEventListener('DOMContentLoaded', calcularMantencion);
    </script>
</body>
</html>
